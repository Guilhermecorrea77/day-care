<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Diário do Bebê</title>
    <meta name="description" content="Registro rápido da rotina do bebê na creche — alimentação, sono, fraldas, saúde — e um relatório do dia para enviar aos pais.">
    <meta name="theme-color" content="#f4f6ff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#15172e" media="(prefers-color-scheme: dark)">
    <script>
        // Aplica o tema salvo antes de desenhar a página (evita "piscar").
        try { var b = JSON.parse(localStorage.getItem('diarioBebe:v2') || 'null'); var t = b && b.config && b.config.tema; if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍼</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <header class="topo">
        <div class="topo-dentro">
            <button type="button" class="crianca-btn" id="btn-crianca" aria-haspopup="dialog" hidden></button>
            <nav class="abas abas-topo" aria-label="Seções" id="abas-topo"></nav>
            <span class="salvo" id="salvo" aria-live="polite">✓ Salvo</span>
            <button type="button" class="tema-btn" id="btn-tema" aria-label="Trocar tema"></button>
        </div>
    </header>

    <main class="pagina" id="app" tabindex="-1"></main>

    <nav class="abas abas-inferior" aria-label="Seções" id="abas-inferior"></nav>

    <dialog class="folha" id="folha" aria-labelledby="folha-titulo">
        <form method="dialog" id="folha-form">
            <div class="folha-alca" aria-hidden="true"></div>
            <div class="folha-corpo" id="folha-corpo"></div>
            <div class="folha-acoes" id="folha-acoes"></div>
        </form>
    </dialog>

    <div class="aviso-flut" id="aviso" role="status" aria-live="polite"></div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
